name             = "epay-proxy-worker"
main             = "worker.js"
compatibility_date = "2024-01-01"

# 将 /api/epay/* 路由到本 Worker
routes = [
  { pattern = "dengxiadingban.asia/api/epay/*", zone_name = "dengxiadingban.asia" }
]

# ── 非敏感环境变量 ──────────────────────────────────────────
[vars]
EPAY_PID = "1013"

# ── 敏感变量（密钥）通过 Wrangler Secret 设置，不要写在此文件中 ──
# 执行以下命令设置密钥（只需执行一次）：
#   wrangler secret put EPAY_KEY
# 然后根据提示粘贴密钥值。
