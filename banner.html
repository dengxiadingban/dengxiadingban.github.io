<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Animated Banner</title>

<style>

  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
  }

  body{
    background:#111;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
    overflow:hidden;

    font-family:
      "Segoe UI",
      "PingFang SC",
      "Microsoft YaHei",
      sans-serif;
  }

  /* =========================
      全局同步动画时间
  ========================= */

  :root{
    --anim-time: .45s;
  }

  /* =========================
      Banner 外层可点击
  ========================= */

  .banner-link{
    text-decoration:none;
    display:block;
    position:relative;
  }

  /* =========================
      Banner
  ========================= */

  .banner{
    width:960px;
    height:120px;

    display:flex;
    overflow:hidden;

    position:relative;

    border-radius:0;

    animation:
      bannerFlash var(--anim-time)
      infinite
      alternate;

    box-shadow:
      0 0 20px rgba(0,0,0,.6);

    cursor:pointer;
  }

  /* =========================
      关闭按钮
  ========================= */

  .close-btn{

    position:absolute;

    top:6px;
    right:6px;

    width:22px;
    height:22px;

    border:none;
    border-radius:50%;

    background:rgba(0,0,0,.35);

    color:#fff;

    font-size:14px;
    font-weight:700;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    z-index:999;

    backdrop-filter:blur(2px);

    transition:
      background .2s ease,
      transform .2s ease;
  }

  .close-btn:hover{
    background:rgba(0,0,0,.55);
    transform:scale(1.08);
  }

  /* =========================
      Images
  ========================= */

  .images{
    display:flex;

    height:120px;

    flex-shrink:0;
    overflow:hidden;
  }

  .img-box{
    position:relative;
    overflow:hidden;
    background:#000;
    flex-shrink:0;
  }

  .img-square{
    width:120px;
    height:120px;
  }

  .img-wide{
    width:180px;
    height:120px;
  }

  .img-box img{
    width:100%;
    height:100%;

    object-fit:cover;

    animation:
      imageZoom var(--anim-time)
      ease-in-out
      infinite
      alternate;
  }

  /* 图片蒙层 */

  .img-box::after{
    content:"";

    position:absolute;
    inset:0;

    background:
      linear-gradient(
        to bottom,
        rgba(255,255,255,.03),
        rgba(0,0,0,.15)
      );

    pointer-events:none;
  }

  /* =========================
      Text Area
  ========================= */

  .text-area{
    flex:1;

    display:flex;
    align-items:center;

    padding-left:30px;

    position:relative;
    overflow:hidden;

    animation:
      textBgFlash var(--anim-time)
      infinite
      alternate;
  }

  /* =========================
      LOGO + 文本
  ========================= */

  .brand-row{
    display:flex;
    align-items:center;
    gap:18px;

    position:relative;
    z-index:2;
  }

  /* =========================
      LOGO 图片
  ========================= */

  .logo{
    width:100px;
    height:100px;

    flex-shrink:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
      rgba(0,0,0,.28);

    padding:6px;

    border:
      2px solid rgba(255,255,255,.12);

    animation:
      logoBgFlash var(--anim-time)
      infinite
      alternate;
  }

  .logo img{
    width:100%;
    height:100%;

    object-fit:contain;
  }

  /* =========================
      两行文字
  ========================= */

  .text-group{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .title,
  .subtitle{

    position:relative;

    font-size:30px;
    font-weight:900;

    letter-spacing:1px;

    line-height:1;

    text-shadow:none;
  }

  .title{
    animation:
      titleFlash var(--anim-time)
      infinite
      alternate;
  }

  .subtitle{
    animation:
      subtitleFlash var(--anim-time)
      infinite
      alternate;
  }

  /* =========================
      CTA按钮
  ========================= */

  .cta{
    position:absolute;

    right:0px;
    bottom:0px;

    padding:
      6px 14px;

    font-size:14px;
    font-weight:900;

    letter-spacing:.5px;

    background:#ffe600;
    color:#000;

    border:
      2px solid rgba(255,255,255,.18);

    animation:
      ctaFlash var(--anim-time)
      infinite
      alternate;

    z-index:3;

    user-select:none;
  }

  /* =========================
      Animations
  ========================= */

  @keyframes imageZoom{

    0%{
      transform:scale(1);
    }

    100%{
      transform:scale(1.18);
    }

  }

  @keyframes bannerFlash{

    0%{
      background:
        linear-gradient(
          135deg,
          #120018 0%,
          #24003b 50%,
          #0d0015 100%
        );
    }

    100%{
      background:
        linear-gradient(
          135deg,
          #3a0030 0%,
          #521b7a 50%,
          #1a0030 100%
        );
    }

  }

  @keyframes textBgFlash{

    0%{
      background:
        rgba(15,0,25,.85);
    }

    100%{
      background:
        rgba(40,0,65,.88);
    }

  }

  @keyframes logoBgFlash{

    0%{
      background:
        rgba(0,0,0,.32);

      border-color:
        rgba(255,255,255,.10);
    }

    100%{
      background:
        rgba(255,255,255,.08);

      border-color:
        rgba(255,255,255,.22);
    }

  }

  @keyframes titleFlash{

    0%{
      color:#ffffff;
    }

    100%{
      color:#ffe600;
    }

  }

  @keyframes subtitleFlash{

    0%{
      color:#ffc7f0;
    }

    100%{
      color:#00ffff;
    }

  }

  @keyframes ctaFlash{

    0%{
      background:#ffe600;
      color:#000000;
    }

    100%{
      background:#ff4fd8;
      color:#ffffff;
    }

  }

</style>
</head>

<body>

<!-- 整个Banner可点击 -->
<a
  class="banner-link"
  href="https://mysite.com/a"
  target="_blank"
  rel="noopener noreferrer"
>

  <div class="banner" id="banner">

    <!-- 关闭按钮 -->
    <button
      class="close-btn"
      id="closeBtn"
      aria-label="关闭广告"
    >
      ×
    </button>

    <!-- 图片区域 -->

    <div class="images">

      <div class="img-box img-square">
        <img src="https://wjs.qingyunshe.top/ads/1/1.webp" referrerpolicy="no-referrer">
      </div>

      <div class="img-box img-square">
        <img src="https://wjs.qingyunshe.top/ads/1/2.webp" referrerpolicy="no-referrer">
      </div>

      <div class="img-box img-square">
        <img src="https://wjs.qingyunshe.top/ads/1/3.webp" referrerpolicy="no-referrer">
      </div>

      <div class="img-box img-wide">
        <img src="https://wjs.qingyunshe.top/ads/1/4.webp" referrerpolicy="no-referrer">
      </div>

    </div>

    <!-- 文字区域 -->

    <div class="text-area">

      <div class="brand-row">

        <div class="logo">
          <img src="https://wjs.qingyunshe.top/ads/logo.webp" referrerpolicy="no-referrer">
        </div>

        <div class="text-group">

          <div class="title">
            aimeitu01.com
          </div>

          <div class="subtitle">
            高清美图免翻页在线观看
          </div>

        </div>

      </div>

      <div class="cta">
        点击进入
      </div>

    </div>

  </div>

</a>

<script>

  // 关闭按钮
  const closeBtn = document.getElementById("closeBtn");
  const banner = document.querySelector(".banner-link");

  closeBtn.addEventListener("click", function(e){

    // 阻止点击按钮时触发跳转
    e.preventDefault();
    e.stopPropagation();

    // 隐藏Banner
    banner.style.display = "none";

  });

</script>

</body>
</html>
